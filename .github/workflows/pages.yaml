# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.132.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # fetch all history for .GitInfo and .Lastmod
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build hybrid site (Hugo + Astro)
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Check game viewports before publishing
        working-directory: apps/puzzleush
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/puzzleush-qa" --no-package-lock --no-save playwright-core@1.63.0
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/puzzleush-qa/node_modules/playwright-core"
          export BROWSER_EXECUTABLE="$(command -v google-chrome)"
          python3 -m http.server 4337 --bind 127.0.0.1 --directory . > "$RUNNER_TEMP/puzzleush-http.log" 2>&1 &
          puzzle_preview_pid=$!
          trap 'kill "$puzzle_preview_pid" 2>/dev/null || true' EXIT
          node scripts/browser-viewport-qa.mjs
          node scripts/browser-finish-qa.mjs
          node scripts/browser-banner-qa.mjs
      - name: Keep game viewport report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kletochki-viewport-qa
          path: |
            apps/puzzleush/test-results/yandex-viewport/
            apps/puzzleush/test-results/sudoku-finish/
            apps/puzzleush/test-results/yandex-banner/
          if-no-files-found: ignore
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Keep matching Yandex game archives
        uses: actions/upload-artifact@v4
        with:
          name: kletochki-yandex
          path: apps/puzzleush/build/yandex/*.zip

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
